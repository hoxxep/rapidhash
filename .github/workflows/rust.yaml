name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-std:
    name: "Test (std)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust dependency cache
        uses: Swatinem/rust-cache@v2
      - name: Compile and run tests
        run: cargo test --no-fail-fast

  test-no-std:
    name: "Test (no-std)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust dependency cache
        uses: Swatinem/rust-cache@v2
      - name: Compile and run tests
        run: cargo test -p rapidhash --no-fail-fast --lib --tests --no-default-features

  test-unsafe:
    name: "Test (unsafe)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust dependency cache
        uses: Swatinem/rust-cache@v2
      - name: Compile and run tests
        run: cargo test -p rapidhash --no-fail-fast --lib --tests --features=unsafe

  test-nightly-all-features:
    name: "Test (nightly, all features)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
      - name: Rust dependency cache
        uses: Swatinem/rust-cache@v2
      - name: Compile and run tests
        run: cargo +nightly test -p rapidhash --no-fail-fast --lib --tests --all-features

  test-nightly-no-std:
    name: "Test (nightly, no-std)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
      - name: Rust dependency cache
        uses: Swatinem/rust-cache@v2
      - name: Compile and run tests (no_std)
        run: cargo +nightly test -p rapidhash --no-fail-fast --lib --tests --no-default-features

  test-32-bit:
    name: "Test (32-bit)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: i686-unknown-linux-gnu
      - name: Install 32-bit C/C++ toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib
      - name: Rust dependency cache
        uses: Swatinem/rust-cache@v2
      - name: Compile and run tests (no_std)
        run: cargo test --target i686-unknown-linux-gnu -p rapidhash --no-fail-fast --lib --tests

  test-msrv:
    name: "Test (MSRV)"
    runs-on: ubuntu-latest
    env:
      RUST_VERSION: 1.71.0
    steps:
      - uses: actions/checkout@v7
      - name: Rust dependency cache
        uses: Swatinem/rust-cache@v2
      - name: Install Rust (rustup, ${{ env.RUST_VERSION }})
        shell: bash
        run: rustup update ${{ env.RUST_VERSION }} --no-self-update && rustup default ${{ env.RUST_VERSION }} && cargo -V && rustc -V
      - name: Compile and run tests (no-std)
        working-directory: rapidhash-msrv
        run: cargo test --no-fail-fast --no-default-features
      - name: Compile and run tests (all features)
        working-directory: rapidhash-msrv
        run: cargo test --no-fail-fast --all-features

  size-checks:
    # Cross-check the compile-time struct-size assertions in rapidhash-msrv over a range of targets.
    # `cargo check` const-evaluates the assertions without linking, running, or even libtest, so no
    # cross toolchain or emulator is needed — only the target's prebuilt std (where applicable).
    # Struct size is endianness-independent, so the axes worth covering are pointer width and u128
    # alignment, plus the wasm (COMPACT) and no-atomics (GlobalSecrets) instantiations:
    #   - x86_64/aarch64: 64-bit, u128 aligned to 16
    #   - s390x:          64-bit, u128 aligned to 8 (the case that broke the old exact-size test)
    #   - i686:           32-bit
    #   - wasm32:         32-bit, exercises the COMPACT=true type aliases
    #   - thumbv6m:       32-bit, no_std + no atomics (checks the non-atomic GlobalSecrets is a ZST)
    # The dependency graph here is tiny (just rapidhash + rustversion), so no build cache is used.
    name: "Size checks (${{ matrix.target }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            args: --features std
          - target: aarch64-unknown-linux-gnu
            args: --features std
          - target: s390x-unknown-linux-gnu
            args: --features std
          - target: i686-unknown-linux-gnu
            args: --features std
          - target: wasm32-unknown-unknown
            args: --features std
          - target: thumbv6m-none-eabi
            args: --no-default-features
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cross-check compile-time struct size assertions
        working-directory: rapidhash-msrv
        run: cargo check ${{ matrix.args }} --target ${{ matrix.target }}

  test-c:
    name: "Test (C implementations)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust dependency cache
        uses: Swatinem/rust-cache@v2
      - name: Compile and run tests
        run: cargo test -p rapidhash-c --no-fail-fast

  test-docs:
    name: "Test (docs)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust dependency cache
        uses: Swatinem/rust-cache@v2
      - name: Compile and run tests
        run: RUSTDOCFLAGS="--cfg docsrs" cargo +nightly test -p rapidhash --all-features --doc --no-fail-fast

  test-wasm:
    # Check compiling for the webassembly target with default features.
    name: "Build (wasm)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust dependency cache
        uses: Swatinem/rust-cache@v2
      - name: Install wasm targets
        run: rustup target add wasm32-unknown-unknown wasm32-wasip1
      - name: Compile and run tests
        run: cargo build -p rapidhash --target wasm32-unknown-unknown
      - name: Run wasm behaviour tests (with and without getrandom)
        run: cargo test -p rapidhash-bench-wasm --test wasm_behaviour --no-fail-fast

  test-no-atomics:
    # Check that a no-atomics target compiles, but it sadly can't run tests
    name: "Build (no atomics)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust dependency cache
        uses: Swatinem/rust-cache@v2
      - name: Install no-atomics target
        run: rustup target add thumbv6m-none-eabi
      - name: Compile and run tests
        run: cargo build -p rapidhash --no-default-features --lib --target thumbv6m-none-eabi
      - name: Compile with a getrandom custom backend
        run: RUSTFLAGS='--cfg getrandom_backend="custom"' cargo build -p rapidhash --no-default-features --features getrandom_04 --lib --target thumbv6m-none-eabi
